<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 12px/1.4 Inter, sans-serif;
        color: var(--figma-color-text);
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 8px;
      }
      button:disabled {
        opacity: 0.5;
      }
      p {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <p>Writes the colour tokens from GitHub onto the variables already in this file.</p>
    <label for="token">GitHub token, Contents: Read</label>
    <input id="token" type="password" autocomplete="off" placeholder="Paste a token, or leave blank to use the saved one" />
    <label for="repo">Repository</label>
    <input id="repo" value="decodedcreative/jigsaw" />
    <label for="branch">Branch</label>
    <input id="branch" value="main" />
    <button id="sync" type="button">Sync variables</button>
    <p id="status"></p>
    <script>
      const tokenInput = document.getElementById("token");
      const repoInput = document.getElementById("repo");
      const branchInput = document.getElementById("branch");
      const syncButton = document.getElementById("sync");
      const status = document.getElementById("status");
      let hasSavedToken = false;
      let pendingSync = null;
      const files = [
        "default-light.tokens.json",
        "default-dark.tokens.json",
        "portfolio.tokens.json",
      ];

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "init") hasSavedToken = Boolean(message.hasToken);
        if (message.type === "token" && pendingSync) {
          const next = pendingSync;
          pendingSync = null;
          runSync(message.token, next.repo, next.branch);
        }
        if (message.type === "result") showResult(message.result);
        if (message.type === "storage-error") status.textContent = message.message;
        updateSyncButton();
      };

      for (const input of [tokenInput, repoInput, branchInput]) {
        input.addEventListener("input", () => {
          status.textContent = "";
          updateSyncButton();
        });
      }
      updateSyncButton();

      syncButton.onclick = async () => {
        status.textContent = "";
        const repo = repoInput.value.trim();
        const branch = branchInput.value.trim();
        const typed = tokenInput.value.trim();
        if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) {
          status.textContent = "Repository should look like owner/name.";
          return;
        }
        if (!/^(?!.*\.\.)(?!\/)(?!.*\/$)[A-Za-z0-9._/-]+$/.test(branch)) {
          status.textContent = "That branch name cannot be used.";
          return;
        }
        if (typed) {
          if (!/^[A-Za-z0-9_-]+$/.test(typed)) {
            status.textContent = "GitHub tokens use letters, numbers, underscores, and hyphens, as in github_pat_…";
            return;
          }
          parent.postMessage({ pluginMessage: { type: "save-token", token: typed } }, "*");
          hasSavedToken = true;
          await runSync(typed, repo, branch);
          return;
        }
        if (!hasSavedToken) {
          status.textContent = "Paste a GitHub token. Contents: Read is enough.";
          return;
        }
        pendingSync = { repo, branch };
        status.textContent = "Reading tokens from GitHub…";
        parent.postMessage({ pluginMessage: { type: "provide-token" } }, "*");
      };

      async function runSync(token, repo, branch) {
        status.textContent = "Reading tokens from GitHub…";
        try {
          const loaded = {};
          for (const file of files) {
            loaded[file] = await fetchTokenFile(token, repo, branch, file);
          }
          parent.postMessage({ pluginMessage: { type: "apply", files: loaded } }, "*");
        } catch (error) {
          status.textContent = String(error.message || error).split(token).join("the saved token");
        }
      }

      function updateSyncButton() {
        const typed = tokenInput.value.trim();
        const repo = repoInput.value.trim();
        const branch = branchInput.value.trim();
        syncButton.disabled = (!typed && !hasSavedToken) || !repo || !branch;
      }

      async function fetchTokenFile(token, repo, branch, file) {
        const path = `packages/tokens/figma/${file}`;
        const response = await fetch(
          `https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`,
          {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github.raw",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          },
        );
        if (!response.ok) throw new Error(`${file} returned ${response.status}`);
        return response.json();
      }

      function showResult(result) {
        const lines = [`Updated ${result.updated} colour values.`];
        if (result.missingCount) {
          lines.push(`${result.missingCount} tokens had no matching variable.`);
          lines.push(...result.missing);
        }
        lines.push(...result.problems);
        status.textContent = lines.join("\n");
      }
    </script>
  </body>
</html>
