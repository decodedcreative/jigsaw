name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Publishes via npm trusted publishing (OIDC): no NPM_TOKEN secret. Each
# @jigsaw-ds package on npmjs.com must list this repo and the workflow file
# `release.yml` as its trusted publisher. Renaming this file breaks publishing
# (JSW-120).
permissions:
  contents: read
  id-token: write # mint the OIDC token npm exchanges for a short-lived publish token

jobs:
  publish:
    name: Publish @jigsaw-ds packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          cache: npm
          # No registry-url: setup-node would write an _authToken line with a
          # placeholder token to .npmrc. The default registry is npmjs.

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm ${NPM_VERSION}"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }' "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/design-system/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Release tag $TAG does not match @jigsaw-ds/design-system version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify changelog entry exists for release version
        run: node scripts/github-release-notes.mjs --require-changelog --version "$VERSION"

      - name: Validate and publish
        # changeset publish runs `npm publish` per package; npm detects the
        # GitHub OIDC environment and authenticates without a token.
        run: npm run publish
