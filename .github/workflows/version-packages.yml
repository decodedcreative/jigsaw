name: Version packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for changed publishable packages
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Open Version packages PR
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so we can diff since the last v* release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Feature PRs do not carry .changeset/*.md — synthesize one from package
      # diffs. Push-to-main defaults to patch; workflow_dispatch / release:*
      # scripts choose minor or major explicitly (--force regenerates).
      - name: Generate changeset from package changes
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run generate-changeset -- --bump "$BUMP" --force
          else
            npm run generate-changeset -- --bump "$BUMP"
          fi

      - name: Create Version packages pull request
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
