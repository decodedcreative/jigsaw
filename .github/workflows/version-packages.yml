name: Version packages

on:
  push:
    branches:
      - main

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Open Version packages PR
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so we can diff since the last v* release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Feature PRs do not carry .changeset/*.md — synthesize one from package
      # diffs since the latest v* tag (skipped when pending changesets exist).
      - name: Generate changeset from package changes
        run: npm run generate-changeset

      - name: Create Version packages pull request
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
