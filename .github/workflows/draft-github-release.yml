name: Draft GitHub release

# Fallback for human-pushed `v*` tags: open a draft Release so publishing to npm
# is a deliberate "Publish release" click (see release.yml). tag-version.yml
# creates the draft in-job for CI tags (GITHUB_TOKEN pushes do not trigger this).
on:
  push:
    tags:
      - "v*"

concurrency:
  group: draft-github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft GitHub release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          node scripts/github-release-notes.mjs --version "$VERSION" --notes-file release-notes.md
          TITLE="$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG is already published; skipping draft update"
              exit 0
            fi
            echo "Updating draft release $TAG"
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file release-notes.md
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" --draft --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
