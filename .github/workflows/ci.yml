name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Disallow hand-written changesets on feature PRs
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          # Explicit allowlist — only these paths may change under .changeset/ on feature PRs.
          disallowed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .changeset/README.md|.changeset/config.json) ;;
              *)
                echo "Disallowed .changeset change: $file"
                disallowed=1
                ;;
            esac
          done < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- .changeset/ || true)
          if [ "$disallowed" -ne 0 ]; then
            echo "Feature PRs must not add release metadata under .changeset/"
            echo "Only README.md and config.json are allowed."
            echo "Cut releases with: npm run version-and-tag:patch|minor|major"
            echo "See docs/publication.md"
            exit 1
          fi

      - name: Test release scripts
        run: |
          npm run test:release-notes
          npm run test:generate-changeset

      - name: Verify no stale @jigsaw/ scope references
        run: |
          if rg --pcre2 '@jigsaw/(?!ds/)' --glob '!.worktrees/**' --glob '!node_modules/**' .; then
            echo 'Found stale @jigsaw/ references — use @jigsaw-ds/ instead.'
            exit 1
          fi

      - name: Check types
        run: npm run check-types

      - name: Test design-system
        run: npm run test --workspace=@jigsaw-ds/design-system

      - name: Test storybook token utilities
        run: |
          npm run build --workspace=@jigsaw-ds/tokens
          npm run test --workspace=@jigsaw-ds/storybook

      - name: Test theme-build and theme CSS packages
        run: |
          npm run test --workspace=@jigsaw-ds/theme-build
          npm run build --workspace=@jigsaw-ds/theme-default
          npm run test --workspace=@jigsaw-ds/theme-default
          npm run build --workspace=@jigsaw-ds/theme-portfolio
          npm run test --workspace=@jigsaw-ds/theme-portfolio

      - name: Validate publishable packages (tarball, publint, attw)
        run: npm run validate:packages

  test-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and verify Figma token exports
        run: |
          npm run test --workspace=@jigsaw-ds/tokens
          npm run verify:figma-tokens --workspace=@jigsaw-ds/tokens
          npm run check:figma-drift --workspace=@jigsaw-ds/tokens
