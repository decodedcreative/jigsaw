name: Tag version

# After a version PR merges to main, create annotated tag v{version} from
# @jigsaw-ds/design-system so draft-github-release.yml can open a draft Release.
# Tags are not created by version-and-tag.mjs (squash merge rewrites SHAs).
on:
  push:
    branches: [main]
    paths:
      - "packages/design-system/package.json"

concurrency:
  group: tag-version-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag if needed
        run: |
          set -euo pipefail

          SUBJECT=$(git log -1 --pretty=%s)
          if ! [[ "$SUBJECT" =~ ^chore:\ version\ packages ]]; then
            echo "Latest commit subject does not match version packages; skipping tag"
            echo "subject: $SUBJECT"
            exit 0
          fi

          VERSION=$(node -p "require('./packages/design-system/package.json').version")
          TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin; skipping"
            exit 0
          fi

          echo "Creating annotated tag ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"
