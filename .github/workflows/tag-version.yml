name: Tag version

# After a version PR merges to main, create annotated tag v{version} from
# @jigsaw-ds/design-system and open a draft GitHub Release in this same job.
# Tags are not created by version-and-tag.mjs (squash merge rewrites SHAs).
# Draft is created here (not only via draft-github-release.yml) because
# GITHUB_TOKEN tag pushes do not trigger other workflows.
on:
  push:
    branches: [main]
    paths:
      - "packages/design-system/package.json"

concurrency:
  group: tag-version-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create annotated tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Pin every decision to the push event SHA. Checkout is already that
          # commit; naming it explicitly keeps subject/version/tag atomic even if
          # a later step ever moved HEAD (there is no in-job race otherwise).
          SHA="${GITHUB_SHA:?GITHUB_SHA is required}"

          if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "skip: wrong branch (ref=${GITHUB_REF:-unset}, expected refs/heads/main)"
            exit 0
          fi

          SUBJECT=$(git log -1 --pretty=%s "$SHA")
          if ! [[ "$SUBJECT" =~ ^chore:\ version\ packages ]]; then
            echo "skip: subject mismatch (expected '^chore: version packages…')"
            echo "subject: $SUBJECT"
            echo "sha: $SHA"
            exit 0
          fi

          VERSION=$(node -p "require('./packages/design-system/package.json').version")
          TAG="v${VERSION}"
          CREATED_TAG=false

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists locally"
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "tag ${TAG} already exists on origin"
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            echo "action: creating and pushing annotated tag ${TAG} at ${SHA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SHA" -m "$TAG"
            git push origin "refs/tags/${TAG}"
            echo "success: pushed tag ${TAG}"
            CREATED_TAG=true
          fi

          # Only open a draft when we created the tag, or when the tag already
          # exists for this version commit and there is no release yet.
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          if [[ "$TAG_SHA" != "$SHA" ]]; then
            echo "skip: tag ${TAG} points to ${TAG_SHA}, not this version commit ${SHA}"
            exit 0
          fi

          if [[ "$CREATED_TAG" != "true" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip: tag ${TAG} already existed and a release is present"
            exit 0
          fi

          # Same create/update draft logic as draft-github-release.yml
          # (update path mainly for retries after we created the tag).
          node scripts/github-release-notes.mjs --version "$VERSION" --notes-file release-notes.md
          TITLE="$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG is already published; skipping draft update"
              exit 0
            fi
            echo "Updating draft release $TAG"
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file release-notes.md
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" --draft --title "$TITLE" --notes-file release-notes.md --target "$SHA"
          fi
